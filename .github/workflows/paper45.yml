# 第191便: 論文4(天体再現 — v0.4 で再構成)・論文5(ミクロの相変移 — 分割で新設)の
# ビルドを CI ゲート化(paper1.yml のひな型 — ビルドのみ)。
# paper/ の変更時のみ実行(重い TeX インストールを常時走らせない)。
#
# **図の再生成ゲートを張らない理由**(paper1.yml と同型): 両論文はドラフト(v0.x)で
#   図はプレースホルダ。実測数値の正本はコミット済みプリセット宣言・出典表 CSV・QA
#   (behavior.* / ai.obs-*)側にあり、そちらは QA ワークフローが毎 push 検査している。
# 第348便f(原仮定者の回答(2026-11-23 —— 第145報の回答 10)AN981・統括の検証項目 R414): 実行環境を ubuntu-24.04(TeX Live 2023)に固定した。2026-11-22 の走行で
#   ubuntu-latest の TeX が TeX Live 2025 になり、論文2・3 の pdflatex が最初の tabular で止まった(論文の tex は不変)。4 本をそろえて固定。見直す時: ubuntu 24.04 の提供が終わる前。
# 第354便a(原仮定者の指示(2026-11-25 —— 第156報)・統括の検証項目 R503): 論文2・3 の前置きに TeX Live 2025(LaTeX 2025-11-01)向けの 1 塊を足したので、組版の段だけを
#   ubuntu-latest(TeX Live 2025)でも回す job `paper45-tl2025` を足した。図の再生成と照合は job `paper45`(ubuntu-24.04)の 1 回だけ。artifact は 24.04 の PDF を正とする。
name: paper45
on:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/paper45.yml"
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper45.yml"
  workflow_dispatch:

jobs:
  paper45:
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # 第317便(決断事項 AN443): TeX の apt のダウンロードがミラーの遅さで 30 分に届いた(2 便続いた)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install TeX Live
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-publishers \
            texlive-fonts-recommended texlive-lang-japanese texlive-luatex
      - name: Build Paper 4 English (pdflatex x2, halt on error)
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error dfm-paper4.tex
          pdflatex -interaction=nonstopmode -halt-on-error dfm-paper4.tex
          ! grep -i "undefined references\|undefined citations" dfm-paper4.log
      - name: Build Paper 4 Japanese (lualatex x2, halt on error)
        working-directory: paper
        run: |
          lualatex -interaction=nonstopmode -halt-on-error dfm-paper4-ja.tex
          lualatex -interaction=nonstopmode -halt-on-error dfm-paper4-ja.tex
          ! grep -i "undefined references\|undefined citations" dfm-paper4-ja.log
      - name: Build Paper 5 English (pdflatex x2, halt on error)
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error dfm-paper5.tex
          pdflatex -interaction=nonstopmode -halt-on-error dfm-paper5.tex
          ! grep -i "undefined references\|undefined citations" dfm-paper5.log
      - name: Build Paper 5 Japanese (lualatex x2, halt on error)
        working-directory: paper
        run: |
          lualatex -interaction=nonstopmode -halt-on-error dfm-paper5-ja.tex
          lualatex -interaction=nonstopmode -halt-on-error dfm-paper5-ja.tex
          ! grep -i "undefined references\|undefined citations" dfm-paper5-ja.log
      - name: Upload PDFs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: paper45-pdfs
          path: |
            paper/dfm-paper4.pdf
            paper/dfm-paper4-ja.pdf
            paper/dfm-paper5.pdf
            paper/dfm-paper5-ja.pdf

  paper45-tl2025:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install TeX Live
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=60 install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-publishers \
            texlive-fonts-recommended texlive-lang-japanese texlive-luatex
      - name: Build Paper 4 English (pdflatex x2, halt on error)
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error dfm-paper4.tex
          pdflatex -interaction=nonstopmode -halt-on-error dfm-paper4.tex
          ! grep -i "undefined references\|undefined citations" dfm-paper4.log
      - name: Show TeX version (LaTeX2e line of the English log)
        if: always()
        working-directory: paper
        run: grep -m1 'LaTeX2e <' dfm-paper4.log
      - name: Build Paper 4 Japanese (lualatex x2, halt on error)
        working-directory: paper
        run: |
          lualatex -interaction=nonstopmode -halt-on-error dfm-paper4-ja.tex
          lualatex -interaction=nonstopmode -halt-on-error dfm-paper4-ja.tex
          ! grep -i "undefined references\|undefined citations" dfm-paper4-ja.log
      - name: Build Paper 5 English (pdflatex x2, halt on error)
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error dfm-paper5.tex
          pdflatex -interaction=nonstopmode -halt-on-error dfm-paper5.tex
          ! grep -i "undefined references\|undefined citations" dfm-paper5.log
      - name: Build Paper 5 Japanese (lualatex x2, halt on error)
        working-directory: paper
        run: |
          lualatex -interaction=nonstopmode -halt-on-error dfm-paper5-ja.tex
          lualatex -interaction=nonstopmode -halt-on-error dfm-paper5-ja.tex
          ! grep -i "undefined references\|undefined citations" dfm-paper5-ja.log
      - name: Upload PDFs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: paper45-pdfs-tl2025
          path: |
            paper/dfm-paper4.pdf
            paper/dfm-paper4-ja.pdf
            paper/dfm-paper5.pdf
            paper/dfm-paper5-ja.pdf
