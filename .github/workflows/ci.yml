# Phase 1 再現性基盤: push/PR ごとに機械QA(構文・verify 11項目・全プリセット・i18n・
# few-shot・BH捕捉・インポート/seed・新サンプル挙動・🪐長時間挙動)を実行し、
# 機械可読な結果JSONを artifact として保存する(ロードマップ Phase 1 / 第6次裁定)。
# 第13次裁定 P0-1: root / beta のマトリクス化 — beta 固有 QA(zonal.*/ice.*/behavior.saturnExp/
# pwa.*)も CI で必須実行し、Release 証跡として対象別 artifact に保存する。
name: QA
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    # 第117便: 30→45 分 — QA 累積成長で第116便時点の実測が beta 23分15秒・root 27分55秒に達し、
    # 第117便(サンプル2件+catalog QA 追加)で beta が 30 分を超過(タイムアウトは
    # ハング防止のガードであり性能ゲートではない — 性能回帰は perf ジョブが別途担う)
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            target: index.html
          - name: beta
            target: beta/index.html
    env:
      QA_TARGET: ${{ matrix.target }}
    steps:
      # P2: サプライチェーン対策 — actions をコミット SHA で固定(タグは移動しうるため)
      # 第190便: Node20 世代の v4 系 SHA(内部 runs.using が node20)がランナーの非推奨警告を
      # 出していたため、node24 世代の最新安定版(checkout v6.1.0 / setup-node v6.5.0 /
      # upload-artifact v6.0.0)の SHA へ更新。SHA は git ls-remote と shallow clone の HEAD の
      # 両方で照合し、各 action.yml の runs.using: node24 を確認済み
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24  # 第41便 41A(台帳4-84): actions の Node 20 非推奨警告に対応(QA は Node 24 で CI 実測確認)
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run QA suite (${{ matrix.name }})
        run: npm test
      - name: Upload machine-readable results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: qa-results-${{ matrix.name }}
          path: tests/out/qa-results.json

  # 第29便(第25次レビュー P0-3): 動的性能回帰ゲート — 同一ジョブ・同一Chromiumで
  # root → beta を順に実測し、代表6サンプルの beta/root 中央値比を ≤1.10 でゲートする。
  # QAマトリクスとは独立のジョブ(両対象を同時に読む必要があるため)。
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24  # 第41便 41A(台帳4-84): actions の Node 20 非推奨警告に対応(QA は Node 24 で CI 実測確認)
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run perf gate (root vs beta)
        run: node tests/perf.mjs
      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: perf-results
          path: tests/out/perf-results.json
