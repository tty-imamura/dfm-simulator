# 第47便 47P(外部レビュー Major 4): 論文2のビルド・図再生成を CI ゲート化。
# paper/ または図生成スクリプトの変更時のみ実行(重い TeX インストールを常時走らせない)。
# 内容: ①図8点を再生成し数値ゲート22件を assert(第143便で図8キャプションの
#       主数値照合ゲート p2fig8.caption を1件追加 — 21件 → 22件) ②再生成 JSON がコミット済み JSON と
# データ一致(揮発キー generated/commit を除く)③英(pdflatex)・日(lualatex)を各2回
# ビルドしエラー・未定義参照ゼロを assert。
# 第287便f(原仮定者の裁定(第77報)AN67): ①② の図の再生成と照合だけを nightly.yml の job `paper2-figures` でも毎晩回す
#   (TeX は nightly に載せない)。照合 ② は tools/p2fig-compare.mjs に移し、この yml と nightly が同じ器を呼ぶ。
name: paper2
on:
  push:
    paths:
      - "paper/**"
      - "tools/gen-figures2.mjs"
      - "tools/p2fig-compare.mjs"
      - ".github/workflows/paper2.yml"
  pull_request:
    paths:
      - "paper/**"
      - "tools/gen-figures2.mjs"
      - "tools/p2fig-compare.mjs"
      - ".github/workflows/paper2.yml"

jobs:
  paper2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Regenerate figures (asserts 22 numeric gates)
        run: node tools/gen-figures2.mjs
      - name: Assert figure data matches committed JSONs (volatile keys excluded)
        # 第287便f(AN67): 照合の式は tools/p2fig-compare.mjs の 1 本(nightly.yml の paper2-figures job と同じ器)。
        #   揮発キー = generated・commit・targetSha256・generatorSha256・chromiumVersion(図のメタの来歴 —— データの失効ではない)
        run: node tools/p2fig-compare.mjs --ref HEAD
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-publishers \
            texlive-fonts-recommended texlive-lang-japanese texlive-luatex
      - name: Build English (pdflatex x2, halt on error)
        working-directory: paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error dfm-paper2.tex
          pdflatex -interaction=nonstopmode -halt-on-error dfm-paper2.tex
          ! grep -i "undefined references\|undefined citations" dfm-paper2.log
      - name: Build Japanese (lualatex x2, halt on error)
        working-directory: paper
        run: |
          lualatex -interaction=nonstopmode -halt-on-error dfm-paper2-ja.tex
          lualatex -interaction=nonstopmode -halt-on-error dfm-paper2-ja.tex
          ! grep -i "undefined references\|undefined citations" dfm-paper2-ja.log
      - name: Upload PDFs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: paper2-pdfs
          path: |
            paper/dfm-paper2.pdf
            paper/dfm-paper2-ja.pdf
