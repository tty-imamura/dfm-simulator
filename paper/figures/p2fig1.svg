serif">  W = D0  +  W_B(a)  +  sum_j m_j / sqrt(d^2+e^2)</text><text x="14" y="64" font-size="11.5" font-family="Georgia,'Times New Roman',serif">  D0    uniform background</text><text x="14" y="79" font-size="11.5" font-family="Georgia,'Times New Roman',serif">  W_B   box term, W_B = D a^-dP</text><text x="14" y="94" font-size="11.5" font-family="Georgia,'Times New Roman',serif">  sum   interior sources (simulated)</text><text x="14" y="117" font-size="12.5" font-weight="bold" font-family="Georgia,'Times New Roman',serif">Semantic commitments (Sec. II A)</text><text x="14" y="132" font-size="11.5" font-family="Georgia,'Times New Roman',serif">  1  outside is summarized, not simulated</text><text x="14" y="147" font-size="11.5" font-family="Georgia,'Times New Roman',serif">  2  summary = D0 + W_B + (optional grav.)</text><text x="14" y="162" font-size="11.5" font-family="Georgia,'Times New Roman',serif">  3  interior physics unchanged</text><text x="14" y="177" font-size="11.5" font-family="Georgia,'Times New Roman',serif">  4  box may be prescribed or free</text><text x="14" y="192" font-size="11.5" font-family="Georgia,'Times New Roman',serif">  5  comoving coords / wavelength rule</text><text x="14" y="207" font-size="11.5" font-family="Georgia,'Times New Roman',serif">     are definitions layered on top</text><text x="14" y="222" font-size="11.5" font-family="Georgia,'Times New Roman',serif">  6  no claim about the real universe</text><text x="14" y="245" font-size="12.5" font-weight="bold" font-family="Georgia,'Times New Roman',serif">Interior coupling to the box</text><text x="14" y="260" font-size="11.5" font-family="Georgia,'Times New Roman',serif">  translation: undetectable (exactly)</text><text x="14" y="275" font-size="11.5" font-family="Georgia,'Times New Roman',serif">  rotation / expansion: gain g(r),</text><text x="14" y="290" font-size="11.5" font-family="Georgia,'Times New Roman',serif">     g(0) = 1/2 for a uniform ring (Fig. 2)</text></g><text x="622" y="16" font-size="14" font-weight="bold" font-family="Georgia,'Times New Roman',serif">(c)</text></svg>